<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order ahead · Josie's Cafe, Utila</title>
<meta name="description" content="Order ahead at Josie's Cafe in Utila and pick it up on your way to the dock.">
<meta name="theme-color" content="#FBF8F4">
<link rel="apple-touch-icon" href="/img/icon-180.png">
<link rel="icon" href="/img/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@600&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<link rel="stylesheet" href="/css/site.css">
</head>
<body data-page="order">
<header class="top">
  <div class="wrap flex center-y">
    <a class="brandlink" href="/"><img src="/img/logo-full.png" alt="Josie's Cafe" width="42" height="56"></a>
    <div class="flex center-y">
      <nav class="nav" aria-label="Main">
        <a href="/" class="home" data-t="home">Home</a><a href="/menu/" data-t="menu">Menu</a><a href="/order/" class="cta on"><span data-t="order">Order</span><span class="count" id="navCount" style="display:none">0</span></a>
      </nav>
      <label class="langpick"><span class="sr" data-t="lang">Language</span><select id="lang" aria-label="Language"></select></label>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="pagehead">
      <span class="kicker" data-t="orderAhead">Order ahead</span>
      <h2 data-t="orderH">Pick it up hot</h2>
    </div>
    <div id="orderForm" class="order flex">
      <div class="col1">
        <div class="card">
          <h3 data-t="yourOrder">Your order</h3>
          <div id="lines"></div>
          <div class="sum" id="sum"></div>
          <p style="margin-top:14px"><a href="/menu/" class="btn soft small" data-t="addMore">Add from the menu</a></p>
        </div>
      </div>
      <form class="card col2" id="details" novalidate>
        <h3 data-t="details">Your details</h3>
        <div class="field"><label for="fName" data-t="name">Name</label><input type="text" id="fName" autocomplete="name" maxlength="40"></div>
        <div class="field"><label for="fPhone" data-t="phone">WhatsApp number</label><input type="tel" id="fPhone" autocomplete="tel" maxlength="24" placeholder="+504"><small data-t="phoneHelp">Only if something's wrong with your order.</small></div>
        <div class="field"><label for="fTime" data-t="pickup">Pick up</label><select id="fTime" class="in"></select><small id="timeHint"></small></div>
        <div class="field"><label data-t="eating">Eating</label>
          <div class="seg flex"><div><input type="radio" name="eat" id="eatHere" value="here" checked><label for="eatHere" data-t="here">Here</label></div><div><input type="radio" name="eat" id="eatGo" value="togo"><label for="eatGo" data-t="togo">To go</label></div></div>
        </div>
        <div class="field"><label for="fNote" data-t="note">Anything else?</label><textarea id="fNote" maxlength="240"></textarea></div>
        <p class="muted small" data-t="payCounter">Pay at the counter when you pick up: lempiras, dollars or card.</p>
        <button class="btn wide" type="submit" id="placeBtn" style="margin-top:16px" data-t="place">Place order</button>
        <p class="err" id="orderErr" role="alert" style="display:none"></p>
      </form>
    </div>
    <div id="orderDone" style="display:none"></div>
  </div>
</main>

<footer class="foot"><div class="wrap">© <span id="year">2026</span> Josie's Cafe · <span data-t="tagline">Coffee · Breakfast · Lunch</span> · Utila, Honduras</div></footer>

<script src="/js/api.js"></script>
<script src="/js/site.js"></script>
</body>
</html>
